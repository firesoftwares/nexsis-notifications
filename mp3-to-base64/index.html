<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MP3 → Base64</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #171a23;
      --card-hover: #1b1f2b;
      --border: #2a2e3b;
      --text: #e8eaf0;
      --muted: #8b90a0;
      --accent: #6c8cff;
      --accent-2: #9b6cff;
      --success: #4ade80;
      --danger: #f87171;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: var(--bg);
      background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(108, 140, 255, 0.12), transparent);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header h1 span {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    header p {
      color: var(--muted);
      margin-top: 6px;
      font-size: 0.95rem;
    }

    /* Drop zone */
    .dropzone {
      background: var(--card);
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: clamp(32px, 8vw, 56px) 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      user-select: none;
    }

    .dropzone:hover, .dropzone:focus-visible {
      border-color: var(--accent);
      background: var(--card-hover);
      outline: none;
    }

    .dropzone.dragover {
      border-color: var(--accent);
      background: var(--card-hover);
      transform: scale(1.01);
    }

    .dropzone .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dropzone .icon svg {
      width: 28px;
      height: 28px;
      stroke: #fff;
    }

    .dropzone .title {
      font-weight: 600;
      font-size: 1.05rem;
    }

    .dropzone .hint {
      color: var(--muted);
      font-size: 0.875rem;
      margin-top: 4px;
    }

    .dropzone .hint u {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px dotted var(--accent);
    }

    /* Progress */
    .progress-wrap {
      display: none;
      padding: 32px 24px;
      text-align: center;
    }

    .progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 16px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 999px;
      transition: width 0.15s ease;
    }

    .progress-label {
      color: var(--muted);
      font-size: 0.875rem;
    }

    /* Result */
    .result {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .result-head {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .result-head .file-icon {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .result-head .file-icon svg { width: 22px; height: 22px; stroke: #fff; }

    .file-meta { min-width: 0; flex: 1; }

    .file-name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-stats {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 2px;
    }

    .replace-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .replace-btn:hover { color: var(--text); border-color: var(--accent); }

    .result-body { padding: 18px 20px; }

    audio {
      width: 100%;
      margin-bottom: 16px;
      border-radius: 8px;
    }

    .output-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .output-label .label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .output-label .size { font-size: 0.8rem; color: var(--muted); }

    .output {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      max-height: 180px;
      overflow-y: auto;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.75rem;
      color: var(--muted);
      word-break: break-all;
      white-space: pre-wrap;
    }

    .output:focus { outline: 1px solid var(--accent); }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 160px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
    }

    .btn-primary:hover { filter: brightness(1.1); }

    .btn-primary.copied {
      background: linear-gradient(135deg, #22c55e, #4ade80);
    }

    .btn svg { width: 18px; height: 18px; stroke: currentColor; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 0.9rem;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100vw - 48px);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.error { border-color: var(--danger); }

    .toast svg { width: 18px; height: 18px; flex-shrink: 0; }

    footer {
      text-align: center;
      margin-top: 24px;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>MP3 <span>→</span> Base64</h1>
      <p>Convert your MP3 file to Base64, locally in your browser.</p>
    </header>

    <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Select an MP3 file">
      <div class="icon">
        <svg fill="none" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <div class="title">Drop your MP3 file here</div>
      <div class="hint">or <u>browse</u> from your device</div>
    </div>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-label" id="progressLabel">Reading file…</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="result" id="result">
      <div class="result-head">
        <div class="file-icon">
          <svg fill="none" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
        <div class="file-meta">
          <div class="file-name" id="fileName"></div>
          <div class="file-stats" id="fileStats"></div>
        </div>
        <button class="replace-btn" id="replaceBtn" type="button">Replace</button>
      </div>
      <div class="result-body">
        <audio id="audioPreview" controls preload="none"></audio>
        <div class="output-label">
          <span class="label">Base64 output</span>
          <span class="size" id="base64Size"></span>
        </div>
        <div class="output" id="output" tabindex="0" aria-label="Base64 preview"></div>
        <div class="actions">
          <button class="btn btn-primary" id="copyBtn" type="button">
            <svg fill="none" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            <span id="copyLabel">Copy to clipboard</span>
          </button>
        </div>
      </div>
    </div>

    <footer>Your file never leaves your device — everything is processed locally.</footer>
  </div>

  <div class="toast" id="toast">
    <svg id="toastIcon" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <span id="toastText"></span>
  </div>

  <input type="file" id="fileInput" accept=".mp3,audio/mpeg" hidden>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');
    const progressLabel = document.getElementById('progressLabel');
    const result = document.getElementById('result');
    const fileName = document.getElementById('fileName');
    const fileStats = document.getElementById('fileStats');
    const base64SizeEl = document.getElementById('base64Size');
    const output = document.getElementById('output');
    const audioPreview = document.getElementById('audioPreview');
    const copyBtn = document.getElementById('copyBtn');
    const copyLabel = document.getElementById('copyLabel');
    const replaceBtn = document.getElementById('replaceBtn');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toastText');
    const toastIcon = document.getElementById('toastIcon');

    const PREVIEW_LENGTH = 3000;
    const CHECK_SVG = '<polyline points="20 6 9 17 4 12"/>';
    const ERROR_SVG = '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';

    let base64String = '';
    let toastTimer = null;

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      const i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      return (bytes / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 2) + ' ' + units[i];
    }

    function showToast(message, isError = false) {
      clearTimeout(toastTimer);
      toastText.textContent = message;
      toastIcon.innerHTML = isError ? ERROR_SVG : CHECK_SVG;
      toast.classList.toggle('error', isError);
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function isMp3(file) {
      return file.type === 'audio/mpeg' || /\.mp3$/i.test(file.name);
    }

    function showProgress(show) {
      dropzone.style.display = show ? 'none' : '';
      result.style.display = show ? 'none' : '';
      progressWrap.style.display = show ? 'block' : 'none';
    }

    function handleFile(file) {
      if (!file) return;
      if (!isMp3(file)) {
        showToast('Please select a valid MP3 file.', true);
        return;
      }

      showProgress(true);
      progressFill.style.width = '0%';
      progressLabel.textContent = 'Reading ' + file.name + '…';

      const reader = new FileReader();

      reader.onprogress = (e) => {
        if (e.lengthComputable) {
          progressFill.style.width = (e.loaded / e.total * 100).toFixed(1) + '%';
        }
      };

      reader.onload = (e) => {
        progressFill.style.width = '100%';
        setTimeout(() => {
          const dataUrl = e.target.result;
          base64String = dataUrl.split(',')[1];

          dropzone.style.display = 'none';
          progressWrap.style.display = 'none';
          result.style.display = 'block';

          fileName.textContent = file.name;
          fileName.title = file.name;
          fileStats.textContent = formatBytes(file.size) + ' · MP3';
          base64SizeEl.textContent = formatBytes(base64String.length) + ' of text';

          output.textContent = base64String.length > PREVIEW_LENGTH
            ? base64String.slice(0, PREVIEW_LENGTH) + '\n\n… (' + formatBytes(base64String.length - PREVIEW_LENGTH) + ' more, shown truncated)'
            : base64String;

          audioPreview.src = dataUrl;

          copyBtn.classList.remove('copied');
          copyLabel.textContent = 'Copy to clipboard';
          showToast('Conversion complete');
        }, 150);
      };

      reader.onerror = () => {
        showProgress(false);
        showToast('Failed to read the file.', true);
      };

      reader.readAsDataURL(file);
    }

    async function copyToClipboard() {
      if (!base64String) return;
      try {
        await navigator.clipboard.writeText(base64String);
      } catch {
        // Fallback for non-secure contexts
        const ta = document.createElement('textarea');
        ta.value = base64String;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      copyBtn.classList.add('copied');
      copyLabel.textContent = 'Copied!';
      showToast('Base64 copied to clipboard');
      setTimeout(() => {
        copyBtn.classList.remove('copied');
        copyLabel.textContent = 'Copy to clipboard';
      }, 2000);
    }

    // Dropzone interactions
    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        fileInput.click();
      }
    });

    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      handleFile(e.dataTransfer.files[0]);
    });

    // Prevent the browser from opening files dropped outside the zone
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => e.preventDefault());

    fileInput.addEventListener('change', () => {
      handleFile(fileInput.files[0]);
      fileInput.value = '';
    });

    replaceBtn.addEventListener('click', () => fileInput.click());
    copyBtn.addEventListener('click', copyToClipboard);
  </script>
</body>
</html>
